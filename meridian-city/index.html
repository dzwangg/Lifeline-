<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prosperia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&family=Mukta:wght@400;600;700;800&family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="policy/policy-panel.css">
<link rel="stylesheet" href="sim/sim-plate.css">
<link rel="stylesheet" href="world/retro-ui.css">
<style>
  /* Frutiger Aero: sunlit sky, clear water, and luminous glass overlays. */
  :root {
    color-scheme: light;
    --sky: #83d8ef;
    --plate: rgba(237, 252, 255, .72);
    --plate-edge: rgba(255, 255, 255, .88);
    --ink: #123e58;
    --muted: #42758a;
    --sodium: #078c9b;
    --load-ink: #15536c;
    --display: 'Overpass', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'Overpass Mono', ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: linear-gradient(145deg, #a7effb, var(--sky) 48%, #b5efdc); color: var(--ink); font-family: var(--display); }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; }
  .plate {
    position: fixed; background: linear-gradient(145deg, rgba(255,255,255,.84), var(--plate) 62%, rgba(191,244,249,.66));
    border: 1px solid var(--plate-edge); border-radius: 18px; padding: 14px 17px;
    box-shadow: 0 12px 36px rgba(14,95,123,.2), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(67,179,198,.18);
    backdrop-filter: blur(18px) saturate(1.35); -webkit-backdrop-filter: blur(18px) saturate(1.35);
  }
  #hud { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 64px); }
  #hud h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .02em; text-wrap: balance; text-shadow: 0 1px 0 white; }
  #hud::before { content: 'Prosperia  /  LIVE MODEL'; display: block; margin-bottom: 5px; color: #138da0; font: 600 9px var(--mono); letter-spacing: .16em; }
  #stats { margin-top: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hint { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--muted); }
  #hint b { color: var(--sodium); font-weight: 600; }
  #credit { margin-top: 6px; font-size: 11px; color: var(--muted); }
  #credit a { color: inherit; }
  #alt { right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 8px 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  #alt span { color: var(--sodium); }
  #alt { border-radius: 999px; padding: 10px 16px; }
  .hint-touch { display: none; }
  @media (pointer: coarse) { .hint-mouse { display: none; } .hint-touch { display: inline; } }
  /* Short screens (phones held sideways): a slimmer info plate so the city stays visible. */
  @media (max-height: 500px) {
    #hud { padding: 10px 14px; max-width: min(440px, calc(100% - 64px)); }
    #hud::before { display: none; }
    #hud h1 { font-size: 16px; }
    #stats { margin-top: 2px; font-size: 11px; }
    #hint { margin-top: 4px; font-size: 11px; line-height: 1.4; }
    #credit { margin-top: 3px; font-size: 10px; }
  }
  @media (max-width: 360px) {
    #hud { left: 12px; max-width: calc(100% - 24px); padding: 12px 14px; }
    #hud h1 { font-size: 18px; }
    #alt { right: 12px; padding: 8px 12px; font-size: 11px; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--load-ink); text-shadow: 0 1px white; }
  #load-bar { width: min(300px, 70vw); height: 12px; box-sizing: border-box; border: 2px solid var(--load-ink); border-radius: 2px; background: rgba(255, 255, 255, .7); box-shadow: 0 2px 0 rgba(21, 83, 108, .25); }
  #load-fill { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--sodium) 0 6px, #0aa6b6 6px 8px); transition: width .2s steps(6); }
  @media (prefers-reduced-motion: reduce) { #load-fill { transition: none; } }
  /* The panels wait for the city: hidden while it builds, then they fade in together. */
  body.city-loading #hud, body.city-loading #alt, body.city-loading #policy-launch, body.city-loading #clock, body.city-loading .plate.sim { visibility: hidden; }
  body.city-ready #hud, body.city-ready #alt, body.city-ready #policy-launch, body.city-ready #clock, body.city-ready .plate.sim { animation: ui-in .35s ease-out; }
  @keyframes ui-in { from { opacity: 0; } } /* opacity only: the clock bar is centred with a transform */
  @media (prefers-reduced-motion: reduce) { body.city-ready #hud, body.city-ready #alt, body.city-ready #policy-launch, body.city-ready #clock, body.city-ready .plate.sim { animation: none; } }
</style>
</head>
<body class="city-loading">

<div id="view"></div>
<div id="loading"><span id="load-msg">Laying out Chapel Hill…</span><span id="load-bar" role="progressbar" aria-label="Loading the city" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5"><span id="load-fill" style="width: 5%"></span></span></div>
<div id="hud" class="plate">
  <h1>University of North Carolina</h1>
  <div id="stats">Surveying…</div>
  <div id="hint"><span class="hint-mouse"><b>Drag</b> pan · <b>Scroll</b> zoom · <b>Q / E</b> rotate · <b>Click</b> a building · <b>Space</b> play / pause · <b>1 2 4</b> speed</span><span class="hint-touch"><b>Drag</b> pan · <b>Pinch</b> zoom · <b>Tap</b> a building</span></div>
  <div id="credit">Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div>
</div>
<div id="alt" class="plate" role="toolbar" aria-label="Map view">
  <button class="tool-btn" id="rot-left" type="button" aria-label="Rotate view left" aria-keyshortcuts="Q"><svg viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M2 1h4v1h1v1h1v3H7V4H6V3H3v2H2V4H1V3h1zM0 3h1v1H0zM3 6h1v1H3zM2 7h1v1h3V7h1v1H6v1H3V8H2z"/></svg></button>
  <button class="tool-btn" id="zoom-out" type="button" aria-label="Zoom out" aria-keyshortcuts="-"><svg viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M1 4h7v1H1z"/></svg></button>
  <span class="zoom-readout" id="zoomv" aria-live="polite">1×</span>
  <button class="tool-btn" id="zoom-in" type="button" aria-label="Zoom in" aria-keyshortcuts="+"><svg viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M4 1h1v3h3v1H5v3H4V5H1V4h3z"/></svg></button>
  <button class="tool-btn" id="rot-right" type="button" aria-label="Rotate view right" aria-keyshortcuts="E"><svg viewBox="0 0 9 9" aria-hidden="true"><path fill="currentColor" d="M3 1h4v1h1v1H7v1H6v2H5V3H2v3H1V3h1V2h1zM8 3h1v1H8zM5 6h1v1H5zM2 7h1v1h3V7h1v1H6v1H3V8H2z"/></svg></button>
</div>
<button id="policy-launch" class="pp-launch" type="button" aria-haspopup="dialog" aria-keyshortcuts="P">Policies <span id="policy-count" class="pp-launch__count is-none">None active</span></button>

<script type="module">
// Policy panel: kept apart from the WebGL build below so it works while the city is still loading.
import { createPolicyStore } from './policy/store.js';
import { mountPolicyPanel } from './policy/policy-panel.js';
import { cardsReady, panelPolicies, demoMode } from './sim/scenario.js';
import { CATEGORIES, slotsOf } from './policy/policies.js';
import { mountSimPlate } from './sim/sim-plate.js';
import { mountClockBar } from './sim/clock-bar.js';

const cards = await cardsReady; // policy cards from data/policies/ join the hardcoded policies in the panel
// ?demo runs two housing cards together, so housing gets a second slot.
const categories = demoMode ? CATEGORIES.map(c => (c.id === 'housing' ? { ...c, slots: 2 } : c)) : CATEGORIES;
const store = createPolicyStore({ policies: panelPolicies(cards), categories, slots: slotsOf(categories) });
const panel = mountPolicyPanel({ store });
const launch = document.getElementById('policy-launch'), count = document.getElementById('policy-count');
launch.addEventListener('click', () => panel.open(launch));
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'p' || document.body.classList.contains('city-loading') || e.ctrlKey || e.metaKey || e.altKey || panel.isOpen() || e.target.closest?.('input, textarea, [contenteditable]')) return;
  panel.open(launch);
});
store.subscribe(({ applied }) => {
  const n = Object.values(applied).filter(Boolean).length;
  count.textContent = n ? `${n} active` : 'None active';
  count.classList.toggle('is-none', !n);
});
window.policyStore = store; // the simulation reads store.getState().applied once it models effects
mountClockBar(); // starts paused, so policies can be set up before Play
mountSimPlate({ policyStore: store, cards });
</script>

<script defer src="chapel-hill.js"></script>
<script defer src="chapel-hill-names.js"></script>
<script type="module">
// The city: a retro isometric game world built from the OSM bake (see world/). The sim's zone layer draws on top.
import { buildWorld } from './world/world.js';
import { ZOOMS, DEFAULT_ZOOM } from './world/palette.js';
import { zonesReady, mountZoneLayer } from './sim/zone-layer.js';
import { mountAgentLayer } from './sim/agent-layer.js';
import { mountFocus } from './sim/focus.js';
import { mountWipe } from './sim/wipe.js';
import { mountBubbles } from './world/aero.js';
import { onFrame } from './sim/scenario.js';

const $ = id => document.getElementById(id);
// The loading bar: the world's build fills it to 85%, the sim's layers and the first frame the rest.
const timings = {};
const progress = (message, fraction) => {
  $('load-msg').textContent = message;
  const pct = Math.round(fraction * 100);
  $('load-fill').style.width = `${pct}%`;
  $('load-bar').setAttribute('aria-valuenow', pct);
};
const frame = () => new Promise(r => { const t = setTimeout(r, 50); requestAnimationFrame(() => { clearTimeout(t); setTimeout(r, 0); }); }); // a paint, or a timer in a hidden tab
await frame();
const OSM = window.CHAPEL_HILL;
if (!OSM) { $('loading').textContent = 'Could not load the Chapel Hill map data.'; throw new Error('chapel-hill.js did not load'); }

const ZONES = await zonesReady;
timings.modulesAndData = Math.round(performance.now()); // since the page started loading: scripts, map data, zones
let world;
try {
  world = await buildWorld({ container: $('view'), osm: OSM, names: window.CHAPEL_HILL_NAMES ?? [], zones: ZONES, progress: (m, f) => progress(m, .08 + f * .77) });
} catch (e) {
  $('loading').textContent = /WebGL/i.test(e.message) ? 'This city needs WebGL, which is turned off in this browser.' : `The city could not be built: ${e.message}`;
  throw e;
}
progress('Placing households…', .88); await frame();
let t = performance.now();
mountZoneLayer({ world, zones: ZONES });
mountAgentLayer({ world, osm: OSM, zones: ZONES });
world.trafficReady.then(traffic => $('clock').setHour(traffic.hour)); // the street's time of day, under the date (clock-bar.js)
mountFocus({ world, osm: OSM, zones: ZONES });
mountWipe({ world });
timings.simLayers = Math.round(performance.now() - t);
$('stats').textContent = `Chapel Hill, NC · ${world.stats.buildings.toLocaleString()} buildings · tallest ${Math.round(world.stats.tallest)} m`;

// Map toolbar: rotate and zoom, mirroring Q/E and +/-.
const readout = $('zoomv');
$('rot-left').addEventListener('click', () => world.view.rotate(-1));
$('rot-right').addEventListener('click', () => world.view.rotate(1));
$('zoom-in').addEventListener('click', () => world.view.zoomBy(1));
$('zoom-out').addEventListener('click', () => world.view.zoomBy(-1));
world.view.onChange(({ level }) => {
  const k = ZOOMS[level] / ZOOMS[DEFAULT_ZOOM];
  readout.textContent = k >= 1 ? `${k}×` : `1/${1 / k}`;
  $('zoom-in').disabled = level === ZOOMS.length - 1; $('zoom-out').disabled = level === 0;
});

// One loop for everything: the camera runs on real time, so the map stays usable while paused; traffic and the
// rest of the city's motion run on the sim clock's time (see sim/clock.js).
progress('Drawing the city…', .95);
t = performance.now();
onFrame((dt, simDt) => world.update(dt, simDt));
if (new URLSearchParams(location.search).has('debug')) globalThis.world = world; // ?debug: the world, for tooling and the console
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); // the first frame is on screen
timings.firstFrame = Math.round(performance.now() - t);
$('loading').remove();
document.body.classList.replace('city-loading', 'city-ready'); // reveal the panels with the city
mountBubbles(document.body, { onFrame }); // drifting Aero bubbles over the city, under the panels
timings.total = Math.round(performance.now()); // since the page started loading
Object.assign(world.timings, timings);
console.info('City ready in', timings.total, 'ms:', world.timings);
window.city = world; // for debugging and for the simulation to reach the world
</script>
</body>
</html>
