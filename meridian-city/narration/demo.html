<!doctype html>
<html lang="en">
<head>

<title>Narration demo</title>

</head>
<body style="font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.5">
<h1>Narration demo</h1>
<p>Recap of <code>tests/fixtures/sim-result.json</code>.</p>
<div id="narration"></div>

import { mountNarration } from './narration.js';

const result = await fetch('../../tests/fixtures/sim-result.json').then(r => r.json());
mountNarration(document.getElementById('narration'), () => result);
</script>
